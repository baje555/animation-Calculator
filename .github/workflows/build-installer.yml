name: Build Windows Installer

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Install WiX 3 – jpackage does NOT support WiX 4 (pre-installed on runner)
      - name: Install WiX 3
        run: |
          Invoke-WebRequest -Uri "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314.exe" -OutFile "$env:TEMP\wix314.exe"
          Start-Process -FilePath "$env:TEMP\wix314.exe" -ArgumentList "/quiet" -Wait
          # Add WiX 3 to PATH (ahead of WiX 4 so jpackage finds the right one)
          $wix3 = "C:\Program Files (x86)\WiX Toolset v3.14\bin"
          echo "$wix3" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        shell: pwsh

      - name: Build fat JAR
        run: mvn package -DskipTests --batch-mode

      - name: Build runtime image with jlink
        run: |
          jlink `
            --module-path "$env:JAVA_HOME\jmods" `
            --add-modules  java.base,java.desktop,java.logging,java.xml,java.prefs,java.naming,jdk.unsupported,jdk.unsupported.desktop `
            --output       target\runtime-image `
            --strip-debug `
            --no-header-files `
            --no-man-pages `
            --compress     zip-6
        shell: pwsh

      - name: Stage input jar
        run: |
          New-Item -ItemType Directory -Force -Path target\jpackage-input | Out-Null
          Copy-Item (Get-ChildItem target\*-fat.jar | Select-Object -First 1).FullName target\jpackage-input\app.jar
        shell: pwsh

      - name: Collect JavaFX jars
        id: fxjars
        run: |
          $jars = (Get-ChildItem "$env:USERPROFILE\.m2\repository\org\openjfx\javafx-*\21.0.2\javafx-*-21.0.2-win.jar" -ErrorAction SilentlyContinue).FullName -join ";"
          echo "FX_JARS=$jars" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Build .exe installer with jpackage
        run: |
          $fxJars = "${{ steps.fxjars.outputs.FX_JARS }}"
          jpackage `
            --type           exe `
            --name           "AnimationExposureCalculator" `
            --app-version    "1.0.0" `
            --description    "Exposure calculator for 2D animators" `
            --vendor         "Animation Tools" `
            --input          target\jpackage-input `
            --main-jar       app.jar `
            --main-class     com.animationcalc.App `
            --runtime-image  target\runtime-image `
            --dest           target\installer `
            --win-dir-chooser `
            --win-menu `
            --win-shortcut `
            --java-options   "-p `"$fxJars`"" `
            --java-options   "--add-modules=javafx.controls" `
            --java-options   "--add-opens=javafx.base/com.sun.javafx.event=ALL-UNNAMED"
        shell: pwsh

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: AnimationExposureCalculator-Windows-Setup
          path: target\installer\AnimationExposureCalculator-*.exe
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.0
          name: "Animation Exposure Calculator v1.0.0"
          body: |
            ## Download & Install
            Click **AnimationExposureCalculator-1.0.0.exe** below.
            Double-click it to install. No Java required — runtime is bundled.

            ## Features
            - **Exposure tab**: calculate drawing positions from frame + step segments
            - **Time ↔ Frames tab**: convert seconds/frames at any FPS
          files: target\installer\AnimationExposureCalculator-*.exe
          draft: false
          prerelease: false
