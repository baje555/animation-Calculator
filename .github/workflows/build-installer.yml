name: Build Windows Installer

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:   # lets you trigger it manually from the GitHub UI

jobs:
  build:
    runs-on: windows-latest   # GitHub's Windows runner has WiX pre-installed

    steps:
      # 1. Check out the source
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Set up JDK 21 (includes jpackage and jlink)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # 3. Build the fat JAR (skip tests for speed; they ran on your machine)
      - name: Build fat JAR with Maven
        run: mvn package -DskipTests --batch-mode

      # 4. Build a minimal JRE with jlink (no javafx.fxml = no java.scripting needed)
      - name: Build runtime image with jlink
        run: |
          $javaHome = $env:JAVA_HOME
          $jmods    = "$javaHome\jmods"
          jlink `
            --module-path "$jmods" `
            --add-modules  java.base,java.desktop,java.logging,java.xml,java.prefs,java.naming,jdk.unsupported,jdk.unsupported.desktop `
            --output       target\runtime-image `
            --strip-debug `
            --no-header-files `
            --no-man-pages `
            --compress     zip-6
        shell: pwsh

      # 5. Collect JavaFX win jars for the module path at launch
      - name: Locate JavaFX jars
        id: fxjars
        run: |
          $jars = (Get-ChildItem "$env:USERPROFILE\.m2\repository\org\openjfx\javafx-*\21.0.2\javafx-*-21.0.2-win.jar").FullName -join ";"
          echo "FX_JARS=$jars" >> $env:GITHUB_OUTPUT
        shell: pwsh

      # 6. Stage the fat JAR for jpackage
      - name: Stage input for jpackage
        run: |
          New-Item -ItemType Directory -Force -Path target\jpackage-input | Out-Null
          Copy-Item (Get-ChildItem target\*-fat.jar | Select-Object -First 1).FullName target\jpackage-input\app.jar
        shell: pwsh

      # 7. Run jpackage → .exe installer (WiX is on the PATH on windows-latest)
      - name: Build .exe installer with jpackage
        run: |
          $fxJars = "${{ steps.fxjars.outputs.FX_JARS }}"
          jpackage `
            --type           exe `
            --name           "AnimationExposureCalculator" `
            --app-version    "1.0.0" `
            --description    "Exposure calculator for 2D animators" `
            --vendor         "Animation Tools" `
            --input          target\jpackage-input `
            --main-jar       app.jar `
            --main-class     com.animationcalc.App `
            --runtime-image  target\runtime-image `
            --dest           target\installer `
            --win-dir-chooser `
            --win-menu `
            --win-shortcut `
            --java-options   "-p `"$fxJars`"" `
            --java-options   "--add-modules=javafx.controls" `
            --java-options   "--add-opens=javafx.base/com.sun.javafx.event=ALL-UNNAMED"
        shell: pwsh

      # 8. Upload the .exe as a build artifact (downloadable from the Actions tab)
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnimationExposureCalculator-Windows-Setup
          path: target\installer\AnimationExposureCalculator-*.exe
          retention-days: 90

      # 9. Also create a GitHub Release so it appears on the Releases page
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.0
          name: "Animation Exposure Calculator v1.0.0"
          body: |
            ## Installation
            Download `AnimationExposureCalculator-1.0.0.exe` and double-click it.
            No Java installation required — the runtime is bundled.

            ## What's included
            - Exposure Calculator tab: draw timing from frame + step segments
            - Time ↔ Frames Converter tab: seconds/frames conversion
          files: target\installer\AnimationExposureCalculator-*.exe
          draft: false
          prerelease: false
